version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pennypulse
      POSTGRES_USER: pennypulse
      POSTGRES_PASSWORD: pennypulse
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/pennypulse
      DB_USER: pennypulse
      DB_PASSWORD: pennypulse
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
